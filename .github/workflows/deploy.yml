name: بناء ونشر نُسُغ

# يُعيد بناء الموقع من data/ وينشره على GitHub Pages تلقائيًّا
# عند كل دفعٍ إلى main، أو يدويًّا من تبويب Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# لا تسمح إلا بنشرٍ واحد في آنٍ واحد
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تهيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: بناء الموقع الثابت
        run: |
          python3 build_site.py
          touch site/.nojekyll

      - name: رفع ناتج البناء
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: النشر على GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
